<section aria-labelledby="newsletter-heading" class="bg-coal py-20 md:py-28">
  <div
    class="mx-auto flex max-w-7xl flex-col items-start justify-between gap-12 px-6 md:flex-row md:items-end"
  >
    <div class="max-w-lg">
      <h2
        id="newsletter-heading"
        class="mb-4 font-display text-5xl leading-none text-white uppercase md:text-6xl"
      >
        Drop 002<br />
        is coming
      </h2>
      <p class="text-base leading-relaxed text-[#888]">
        Get the email before the shirts hit the site. No spam, a few times a year.
      </p>
    </div>

    <div class="w-full md:w-auto md:min-w-[380px]">
      <form method="post" [attr.action]="newsletter.action" class="border-b border-[#666]">
        <!-- Disabled until a provider URL is set, so it can never post to this page. -->
        <fieldset [disabled]="!newsletter.action" class="flex min-w-0 items-center gap-4">
          <label for="newsletter-email" class="sr-only">Email address</label>
          <input
            id="newsletter-email"
            type="email"
            [name]="newsletter.emailField"
            required
            autocomplete="email"
            placeholder="you@email.com"
            class="min-w-0 flex-1 bg-transparent py-4 text-sm text-white placeholder:text-[#808080]"
          />
          @for (field of newsletter.hidden; track field.name) {
            <input type="hidden" [name]="field.name" [value]="field.value" />
          }
          <button
            type="submit"
            class="shrink-0 py-4 text-xs font-bold tracking-widest text-accent uppercase transition-colors enabled:hover:text-accent-hover disabled:cursor-not-allowed"
          >
            Sign up
          </button>
        </fieldset>
      </form>
      <p class="mt-3 text-[11px] text-[#888]">
        {{ newsletter.action ? 'No spam. Unsubscribe anytime.' : 'Sign-ups open soon.' }}
      </p>
    </div>
  </div>
</section>

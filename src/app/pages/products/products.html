<main id="main" tabindex="-1" class="flex-1 py-24 md:py-32">
  <div class="mx-auto max-w-7xl px-6">
    <p class="eyebrow mb-5">Shop</p>
    <h1 class="mb-6 font-display text-5xl leading-none text-ink uppercase md:text-6xl lg:text-7xl">
      Products
    </h1>
    <p class="mb-16 text-base leading-loose text-body">A short list, on purpose.</p>

    <ul class="grid grid-cols-1 gap-8 sm:grid-cols-2">
      @for (product of products(); track product.slug; let first = $first) {
        <li class="border border-line bg-surface">
          <a
            [routerLink]="['/products', product.slug]"
            class="group flex h-full flex-col transition-colors hover:bg-page"
          >
            <!-- Decorative: the heading below already names the link. -->
            <img
              [ngSrc]="product.images[0].src"
              width="800"
              height="600"
              [priority]="first"
              alt=""
              sizes="(min-width: 640px) 50vw, 100vw"
              class="w-full"
            />
            <div class="flex flex-1 flex-col gap-4 p-10">
              <div class="flex items-baseline justify-between gap-4">
                <h2
                  class="font-display text-3xl leading-none text-ink uppercase transition-colors group-hover:text-accent-text"
                >
                  {{ product.name }}
                </h2>
                <span class="font-display text-2xl leading-none text-accent-large">{{
                  product.price
                }}</span>
              </div>
              <p class="text-sm leading-relaxed text-muted">{{ product.summary }}</p>
            </div>
          </a>
        </li>
      }
    </ul>
  </div>
</main>

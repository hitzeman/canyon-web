<header class="fixed inset-x-0 top-0 z-50 border-b border-line bg-page">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6">
    <a routerLink="/" class="shrink-0" (click)="closeMenu()">
      <span class="sr-only">{{ site.name }}</span>
      <app-canyon-logo class="h-9 md:h-10" />
    </a>

    <nav aria-label="Main" class="hidden items-center gap-10 md:flex">
      @for (item of nav; track item.label) {
        <a
          [routerLink]="item.path"
          [fragment]="item.fragment"
          routerLinkActive
          [routerLinkActiveOptions]="activeOptions"
          ariaCurrentWhenActive="page"
          class="text-xs font-semibold tracking-widest text-nav uppercase transition-colors hover:text-accent-text"
          >{{ item.label }}</a
        >
      }

      <a
        routerLink="/products"
        class="flex items-center gap-1.5 text-xs font-semibold tracking-widest text-nav uppercase"
      >
        Cart
        <span
          aria-hidden="true"
          class="flex size-5 items-center justify-center rounded-full bg-coal text-[10px] font-bold text-white"
          >0</span
        >
        <span class="sr-only">(0 items)</span>
      </a>

      <button
        type="button"
        aria-label="Dark mode"
        [attr.aria-pressed]="theme.isDark()"
        (click)="theme.toggle()"
        class="flex size-8 items-center justify-center rounded-full border border-control-line bg-control text-ink transition-colors"
      >
        <!-- Both icons render and CSS picks one, so the prerendered HTML is right before hydration. -->
        <svg
          class="dark:hidden"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg
          class="hidden dark:block"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      </button>
    </nav>

    <button
      #menuButton
      type="button"
      aria-label="Menu"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
      class="flex flex-col gap-1.5 p-2 md:hidden"
    >
      <span class="block h-0.5 w-5 bg-ink"></span>
      <span class="block h-0.5 w-5 bg-ink"></span>
      <span class="block h-0.5 w-5 bg-ink"></span>
    </button>
  </div>

  <div
    id="mobile-menu"
    [hidden]="!menuOpen()"
    class="flex flex-col gap-5 border-t border-line bg-page px-6 pt-2 pb-6 md:hidden"
  >
    <nav aria-label="Main" class="flex flex-col gap-5">
      @for (item of nav; track item.label) {
        <a
          [routerLink]="item.path"
          [fragment]="item.fragment"
          routerLinkActive
          [routerLinkActiveOptions]="activeOptions"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
          class="text-sm font-semibold tracking-widest text-nav uppercase"
          >{{ item.label }}</a
        >
      }
      <a
        routerLink="/products"
        (click)="closeMenu()"
        class="text-sm font-semibold tracking-widest text-nav uppercase"
        >Cart</a
      >
    </nav>
    <button
      type="button"
      (click)="theme.toggle()"
      class="self-start text-xs font-semibold tracking-widest text-accent-text uppercase underline"
    >
      <span class="dark:hidden">Dark mode</span>
      <span class="hidden dark:inline">Light mode</span>
    </button>
  </div>
</header>

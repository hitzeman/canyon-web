<main id="main" tabindex="-1" class="flex-1 py-24 md:py-32">
  <div class="mx-auto max-w-7xl px-6">
    <div class="max-w-2xl">
      <p class="eyebrow mb-5">{{ page().section }}</p>
      <h1 class="mb-8 font-display text-5xl leading-none text-ink uppercase md:text-6xl">
        {{ page().title }}
      </h1>
      <div class="space-y-4 text-base leading-loose text-body">
        @for (paragraph of page().body; track $index) {
          <p>{{ paragraph }}</p>
        }
        <p>
          Questions in the meantime? Email
          <a [href]="'mailto:' + site.email" class="inline-link">{{ site.email }}</a
          >.
        </p>
      </div>
    </div>
  </div>
</main>

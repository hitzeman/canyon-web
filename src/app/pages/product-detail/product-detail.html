<main id="main" tabindex="-1" class="flex-1 py-24 md:py-32">
  <div class="mx-auto max-w-7xl px-6">
    <a routerLink="/products" class="link-underline"
      ><span aria-hidden="true">&larr;</span> All products</a
    >

    <div class="mt-12 grid grid-cols-1 gap-16 md:grid-cols-2 md:gap-24">
      <div>
        <p class="eyebrow mb-5">Shop</p>
        <h1 class="mb-6 font-display text-5xl leading-none text-ink uppercase md:text-6xl">
          {{ product().name }}
        </h1>
        <p class="mb-8 font-display text-4xl leading-none text-accent-large">
          {{ product().price }}
        </p>
        <p class="text-base leading-loose text-body">{{ product().description }}</p>
      </div>

      <div>
        <h2 class="mb-5 text-xs font-bold tracking-widest text-quiet uppercase">Details</h2>
        <ul class="grid gap-px bg-line">
          @for (feature of product().features; track feature) {
            <li class="bg-surface px-6 py-5 text-sm text-body">{{ feature }}</li>
          }
        </ul>
      </div>
    </div>
  </div>
</main>

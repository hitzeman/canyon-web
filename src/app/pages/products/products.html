<main class="mx-auto w-full max-w-5xl flex-1 px-6 py-20">
  <h1 class="text-4xl font-semibold tracking-tight">Products</h1>
  <p class="mt-4 text-lg text-black/70 dark:text-white/70">A short list, on purpose.</p>

  <ul class="mt-12 grid gap-6 sm:grid-cols-2">
    @for (product of products(); track product.slug) {
      <li>
        <a
          [routerLink]="['/products', product.slug]"
          class="block h-full rounded-2xl border border-black/10 p-6 transition-colors hover:border-black/30 dark:border-white/10 dark:hover:border-white/30"
        >
          <div class="flex items-baseline justify-between gap-4">
            <h2 class="font-medium">{{ product.name }}</h2>
            <span class="text-sm font-medium">{{ product.price }}</span>
          </div>
          <p class="mt-2 text-sm leading-6 text-black/60 dark:text-white/60">
            {{ product.summary }}
          </p>
        </a>
      </li>
    }
  </ul>
</main>

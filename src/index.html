<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canyon Supply Co.</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the theme before first paint: the prerendered HTML can't know the
      // visitor's choice. Keep in sync with src/app/core/theme.ts.
      try {
        var theme = localStorage.getItem('theme');
        document.documentElement.classList.toggle(
          'dark',
          theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches,
        );
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
